<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela Jornada</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h2>⚽ Quiniela</h2>
<p class="subtitulo">Jornada 6 · Liga MX Apertura 2026</p>

<div id="partidos"></div>

<br>
<label style="color:#94a3b8;font-weight:600;">✏️ Tu nombre:</label>
<input type="text" id="nombre" placeholder="Escribe tu nombre...">

<br><br>

<div class="grupo-botones">
    <button class="btn-verde" onclick="aleatorio()">🎲 Llenar Aleatoria</button>
    <button class="btn-rojo" onclick="limpiarTodo()">🗑️ Limpiar selecciones</button>
</div>

<h3>💰 Total a pagar: $<span id="total">10</span> MXN</h3>

<h3 style="margin-top:25px;">📋 Quinielas agregadas:</h3>
<div id="listaQuinielas"></div>

<div class="grupo-botones">
    <button class="btn-azul" onclick="agregarQuiniela()">➕ Agregar Quiniela</button>
    <button id="btnTabla" class="btn-morado" onclick="mostrarTabla()">📊 Ver Tabla</button>
    <button class="btn-whatsapp" onclick="enviarQuiniela()">📱 Enviar por WhatsApp</button>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
